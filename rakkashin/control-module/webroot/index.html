<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakkashin Kernel</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --sub:#6e6e73; --line:#d2d2d7; --acc:#e0457b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --sub:#98989d; --line:#38383a; --acc:#ff5c93; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.45 system-ui, -apple-system, "Noto Sans JP", sans-serif; }
  header { margin:4px 0 16px; }
  h1 { font-size:22px; margin:0; letter-spacing:.02em; }
  h1 span { color:var(--acc); }
  h2 { font-size:16px; margin:0 0 10px; }
  .sub { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.mode { text-align:left; padding:12px; border-radius:12px; border:2px solid var(--line);
                background:transparent; color:var(--fg); font:inherit; cursor:pointer; }
  button.mode b { display:block; font-size:16px; }
  button.mode span { color:var(--sub); font-size:13px; }
  button.mode.on { border-color:var(--acc); }
  button.mode.extreme { grid-column:1 / -1; }
  button.mode.extreme b { color:#e5484d; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0; }
  .row + .row { border-top:1px solid var(--line); }
  input[type=number] { width:80px; font:inherit; color:var(--fg); background:var(--bg);
                      border:1px solid var(--line); border-radius:8px; padding:4px 6px; }
  input[type=checkbox] { width:22px; height:22px; flex:none; accent-color:var(--acc); }
  #status { min-height:1.4em; margin:10px 0 0; }
  .wl { font-size:13px; }
  .wl .name { word-break:break-all; }
  .wl .meta { color:var(--sub); font-variant-numeric:tabular-nums; }
  button.link { background:none; border:0; color:var(--acc); font:inherit; padding:0; cursor:pointer; }
  select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
           border-radius:8px; padding:4px 6px; flex:none; }
  select.set { border-color:var(--acc); }
  #now { margin:0 0 10px; }
  #appfilter { width:100%; font:inherit; color:var(--fg); background:var(--bg);
               border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
</style>
</head>
<body>
<header>
  <h1><span>Rakkashin</span> Kernel</h1>
  <div class="sub" id="ver"></div>
</header>

<div class="card">
  <div class="row" style="padding:0">
    <div><b data-i18n="pw_title"></b><div class="sub" data-i18n="pw_desc"></div></div>
    <div style="text-align:right"><b id="pw_now" style="font-size:20px">-</b><div class="sub" id="pw_avg"></div></div>
  </div>
</div>

<div class="card" id="plcard">
  <div class="row" style="padding:0">
    <div><b data-i18n="pl_title"></b><div class="sub" data-i18n="pl_desc"></div></div>
    <div style="white-space:nowrap"><input type="number" id="pl" min="0" max="30" step="0.5"> W</div>
  </div>
  <p class="sub" id="plstate"></p>
</div>

<div class="card">
  <h2 data-i18n="profile"></h2>
  <p class="sub" id="now"></p>
  <div class="modes" id="modes"></div>
  <p class="sub" id="status"></p>
  <p class="sub" id="caps"></p>
  <div class="row">
    <div><b data-i18n="sc_title"></b><div class="sub" data-i18n="sc_desc"></div></div>
    <select id="smartcap">
      <option value="70">70%</option><option value="75">75%</option>
      <option value="80">80%</option><option value="85">85%</option>
      <option value="90">90%</option><option value="100">OFF</option>
    </select>
  </div>
  <div class="row" id="susrow">
    <div><b data-i18n="sus_title"></b><div class="sub" data-i18n="sus_desc"></div></div>
    <input type="checkbox" id="sustained">
  </div>
  <div class="row" id="sustemprow">
    <div><b data-i18n="sust_title"></b><div class="sub" data-i18n="sust_desc"></div><div class="sub" id="susstate"></div></div>
    <select id="sustemp">
      <option value="36">36°C</option><option value="38">38°C</option>
      <option value="40">40°C</option><option value="42">42°C</option>
      <option value="44">44°C</option>
    </select>
  </div>
</div>

<div class="card">
  <div class="row" style="padding-top:0">
    <h2 data-i18n="apps_title" style="margin:0"></h2>
    <input type="checkbox" id="perapp">
  </div>
  <p class="sub" data-i18n="apps_desc"></p>
  <input id="appfilter" type="search">
  <div id="apps"></div>
</div>

<div class="card">
  <div class="row">
    <div><b data-i18n="lb_title"></b><div class="sub" data-i18n="lb_desc"></div></div>
    <input type="checkbox" id="lb">
  </div>
  <div class="row">
    <div><b data-i18n="tb_title"></b><div class="sub" data-i18n="tb_desc"></div></div>
    <input type="checkbox" id="tb">
  </div>
  <div class="row" id="gpurow">

    <input type="checkbox" id="gpu">
  </div>
  <div class="row" id="fasrow">

    <input type="checkbox" id="fas">

  <div class="row">
    <div><b data-i18n="io_title"></b><div class="sub" data-i18n="io_desc"></div></div>

  <div class="row">

  <div id="wl"></div>
</div>

const MODDIR = "/data/adb/modules/rakkashin";
const STATE = "/data/adb/rakkashin";
const NODE = "/sys/kernel/avr_profile";
const FSYNC = "/sys/module/sync/parameters/fsync_enabled";
const LB = "/sys/module/launch_boost/parameters/enabled";
const TB = "/sys/module/rk_tboost/parameters/enabled";
const WLB = "/sys/class/misc/boeffla_wakelock_blocker/wakelock_blocker";
const MODES = ["battery", "balanced", "performance", "game", "extreme"];

// KernelSU WebUI bridge: ksu.exec(cmd, optionsJson, callbackName)
function exec(cmd) {
  return new Promise((resolve) => {
    const cb = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
    window[cb] = (errno, stdout, stderr) => { delete window[cb]; resolve({ errno, stdout, stderr }); };
    ksu.exec(cmd, "{}", cb);
  });
}
const status = (t) => { document.getElementById("status").textContent = t; };
const q = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";

function renderModes(current) {
  const box = document.getElementById("modes");
  box.replaceChildren();
  for (const id of MODES) {
    const b = document.createElement("button");
    b.className = "mode" + (id === "extreme" ? " extreme" : "") + (id === current ? " on" : "");
    const t = document.createElement("b"); t.textContent = T[id][0];
    const d = document.createElement("span"); d.textContent = T[id][1];
    b.append(t, d);
    b.onclick = () => setMode(id);
    box.append(b);
  }
}

// global (user-chosen) mode and what is in effect right now
let uidToPkg = {};
async function readMode() {
  const r = await exec(`cat ${NODE}/status`);
  const kv = Object.fromEntries(r.stdout.trim().split(" ").map((x) => x.split("=")));
  const now = document.getElementById("now");
  now.textContent = kv.app && kv.app !== "-"
    ? T.now_app(T[kv.active][0], uidToPkg[kv.app] || kv.app)
    : T.now_global;
  return kv.global || null;
}

async function readToggles() {
  const [f, l, tb] = await Promise.all([exec(`cat ${FSYNC}`), exec(`cat ${LB}`), exec(`cat ${TB}`)]);
  document.getElementById("fsync").checked = f.stdout.trim() === "Y";
  document.getElementById("lb").checked = l.stdout.trim() === "Y";
  document.getElementById("tb").checked = tb.stdout.trim() === "Y";
}

async function setMode(id) {
  const r = await exec(`sh ${MODDIR}/apply.sh ${id}`);
  if (r.errno !== 0) { status(T.failed + r.stderr); return; }
  renderModes(await readMode());
  await readToggles();
  status(T.switched);
}

function bindToggle(elId, node, stateFile) {
  document.getElementById(elId).onchange = async (e) => {
    const v = e.target.checked ? "Y" : "N";
    await exec(`echo ${v} > ${node} && mkdir -p ${STATE} && echo ${v} > ${STATE}/${stateFile}`);
  };
}

async function loadWakelocks() {
  const list = await exec(
    `for d in /sys/class/wakeup/*; do printf '%s\\t%s\\t%s\\n' "$(cat $d/name)" "$(cat $d/total_time_ms)" "$(cat $d/active_count)"; done 2>/dev/null | sort -t "$(printf '\\t')" -k2,2nr | head -40`);
  const cur = (await exec(`cat ${WLB}`)).stdout.trim();
  const blocked = new Set(cur.split(";").filter(Boolean));
  const box = document.getElementById("wl");
  box.replaceChildren();
  for (const line of list.stdout.split("\n")) {
    const [name, ms, cnt] = line.split("\t");
    if (!name) continue;
    const row = document.createElement("label");
    row.className = "row wl";
    const left = document.createElement("div");
    const n = document.createElement("div"); n.className = "name"; n.textContent = name;
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `${(Number(ms) / 1000).toFixed(1)} s · ${cnt}${T.count}`;
    left.append(n, m);
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = blocked.has(name);
    cb.onchange = async () => {
      cb.checked ? blocked.add(name) : blocked.delete(name);
      const v = [...blocked].join(";");
      await exec(`echo ${q(v)} > ${WLB} && mkdir -p ${STATE} && echo ${q(v)} > ${STATE}/wl_block`);
      status(T.blocked);
    };
    row.append(left, cb);
    box.append(row);
  }
}

// ---- per-app profiles ----
let profiles = new Map();	// uid -> mode
async function saveProfiles() {
  const v = [...profiles].map(([u, m]) => `${u}:${m}`).join(" ");
  const r = await exec(`echo ${q(v)} > ${NODE}/app_profiles && mkdir -p ${STATE} && echo ${q(v)} > ${STATE}/app_profiles`);
  status(r.errno === 0 ? T.saved : T.failed + r.stderr);
  readMode();
}

async function loadApps() {
  const [pk, cur, pa] = await Promise.all([
    exec("pm list packages -3 -U"), exec(`cat ${NODE}/app_profiles`), exec(`cat ${NODE}/per_app`)]);
  document.getElementById("perapp").checked = pa.stdout.trim() === "1";
  profiles = new Map(cur.stdout.trim().split(/\s+/).filter(Boolean).map((t) => t.split(":")));
  const apps = [];
  for (const line of pk.stdout.split("\n")) {
    const m = line.match(/^package:(\S+) uid:(\d+)/);
    if (m) { apps.push({ pkg: m[1], uid: m[2] }); uidToPkg[m[2]] = m[1]; }
  }
  // apps with a profile first, then alphabetical
  apps.sort((a, b) => (profiles.has(b.uid) - profiles.has(a.uid)) || a.pkg.localeCompare(b.pkg));
  const box = document.getElementById("apps");
  box.replaceChildren();
  for (const a of apps) {
    const row = document.createElement("div");
    row.className = "row wl"; row.dataset.pkg = a.pkg;
    const n = document.createElement("div"); n.className = "name"; n.textContent = a.pkg;
    const sel = document.createElement("select");
    for (const v of ["", ...MODES]) {
      const o = document.createElement("option");
      o.value = v; o.textContent = v ? T[v][0] : T.use_global;
      sel.append(o);
    }
    sel.value = profiles.get(a.uid) || "";
    sel.classList.toggle("set", !!sel.value);
    sel.onchange = () => {
      sel.value ? profiles.set(a.uid, sel.value) : profiles.delete(a.uid);
      sel.classList.toggle("set", !!sel.value);
      saveProfiles();
    };
    row.append(n, sel);
    box.append(row);
  }
  readMode();
}

async function init() {
  const v = await exec(`cat ${NODE}/version`);
  if (v.errno !== 0) { status(T.unsupported); return; }
  document.getElementById("ver").textContent = v.stdout.trim();
  renderModes(await readMode());
  await readToggles();
  const pl = document.getElementById("pl");
  const plr = await exec(`cat ${NODE}/power_limit`);
  if (plr.errno === 0) {
    const showPl = (txt) => {
      const kv = Object.fromEntries(txt.trim().split(" ").map((x) => x.split("=")));
      document.getElementById("plstate").textContent =
        Number(kv.limit) ? T.pl_state((kv.now / 1000).toFixed(2), kv.cpu_cap) : "";
      return kv;
    };
    pl.value = (showPl(plr.stdout).limit / 1000).toString();
    pl.onchange = async () => {
      const mw = Math.round(Math.max(0, Number(pl.value) || 0) * 1000);
      const v = mw && mw < 500 ? 500 : Math.min(mw, 30000);
      const r = await exec(`echo ${v} > ${NODE}/power_limit && mkdir -p ${STATE} && echo ${v} > ${STATE}/power_limit`);
      status(r.errno === 0 ? T.pl_saved : T.failed + r.stderr);
    };
    setInterval(async () => {
      if (!document.hidden) showPl((await exec(`cat ${NODE}/power_limit`)).stdout);
    }, 2000);
  } else {
    document.getElementById("plcard").style.display = "none";
  }
  const sus = document.getElementById("sustained");
  const susv = await exec(`cat ${NODE}/sustained`);
  if (susv.errno === 0) {
    sus.checked = susv.stdout.trim() === "1";
    sus.onchange = async () => {
      const v = sus.checked ? 1 : 0;
      await exec(`echo ${v} > ${NODE}/sustained && mkdir -p ${STATE} && echo ${v} > ${STATE}/sustained`);
      status(sus.checked ? T.sus_on : T.sus_off);
    };
  } else {
    document.getElementById("susrow").style.display = "none";
  }
  const st = document.getElementById("sustemp");
  const stv = await exec(`cat ${NODE}/sustained_temp`);
  if (stv.errno === 0 && susv.errno === 0) {
    st.value = stv.stdout.trim();
    st.onchange = async () => {
      await exec(`echo ${st.value} > ${NODE}/sustained_temp && mkdir -p ${STATE} && echo ${st.value} > ${STATE}/sustained_temp`);
      status(T.sust_saved);
    };
    const showSus = async () => {
      const el = document.getElementById("susstate");
      if (!sus.checked) { el.textContent = ""; return; }
      const m = (await exec(`cat ${NODE}/sustained_state`)).stdout
        .match(/skin=(-|-?\d+) engaged=(\d) headroom=(\d+)/);
      if (!m) { el.textContent = ""; return; }
      if (m[1] === "-") el.textContent = m[2] === "1" ? T.sus_nosensor(m[3]) : "";
      else {
        const t = (Number(m[1]) / 1000).toFixed(1);
        el.textContent = m[2] === "1" ? T.sus_hot(t, m[3]) : T.sus_cool(t);
      }
    };
    showSus();
    setInterval(() => { if (!document.hidden) showSus(); }, 2000);
  } else {
    document.getElementById("sustemprow").style.display = "none";
  }
  const sc = document.getElementById("smartcap");
  const scv = await exec(`cat ${NODE}/smart_cap`);
  if (scv.errno === 0) {
    sc.value = scv.stdout.trim();
    sc.onchange = async () => {
      await exec(`echo ${sc.value} > ${NODE}/smart_cap && mkdir -p ${STATE} && echo ${sc.value} > ${STATE}/smart_cap`);
      status(T.sc_saved);
    };
  } else {
    sc.closest(".row").style.display = "none";
  }
  const caps = await exec(`cat ${NODE}/battery_caps`);
  if (caps.errno === 0)
    document.getElementById("caps").textContent = T.caps + ": " +
      caps.stdout.trim().split("\n").map((l) => {
        const m = l.match(/^(cpu\d+): (\d+)\/(\d+) kHz \((\S+)\)/);
        return m ? `${m[1]} ${(m[2] / 1e6).toFixed(2)}/${(m[3] / 1e6).toFixed(2)} GHz${m[4] === "fallback" ? " (70%)" : ""}` : l;
      }).join(" · ");
  bindToggle("fsync", FSYNC, "fsync");
  bindToggle("lb", LB, "launch_boost");
  bindToggle("tb", TB, "tboost");
  const gpu = document.getElementById("gpu");
  const gpuOk = (await exec(`[ -e ${NODE}/demand_active ] && [ -w /sys/kernel/gpu/gpu_max_clock ]`)).errno === 0;
  // gpud.sh restarts rk_gpud with both settings; SIGTERM makes it restore
  // the GPU max clock first
  const gpud = (file, on) =>
    exec(`mkdir -p ${STATE} && echo ${on ? 1 : 0} > ${STATE}/${file}; sh ${MODDIR}/gpud.sh restart`);
  if (!gpuOk) {
    document.getElementById("gpurow").style.display = "none";
  } else {
    gpu.checked = (await exec(`cat ${STATE}/gpu 2>/dev/null`)).stdout.trim() !== "0";
    gpu.onchange = async () => {
      await gpud("gpu", gpu.checked);
      status(gpu.checked ? T.gpu_on : T.gpu_off);
    };
  }
  const fas = document.getElementById("fas");
  const fasOk = (await exec(`[ -e /dev/encore_fas ] && [ -e ${NODE}/top_pid ]`)).errno === 0;
  if (!fasOk) {
    document.getElementById("fasrow").style.display = "none";
  } else {
    fas.checked = (await exec(`cat ${STATE}/fas 2>/dev/null`)).stdout.trim() !== "0";
    fas.onchange = async () => {
      await gpud("fas", fas.checked);
      status(fas.checked ? T.fas_on : T.fas_off);
    };
    const showFas = async () => {
      const el = document.getElementById("fasstate");
      if (!fas.checked) { el.textContent = ""; return; }
      const r = (await exec(`cat ${STATE}/fas_state 2>/dev/null; cat ${NODE}/frame_state`)).stdout;
      const m = r.match(/pid=(\d+) fps=(\d+) degraded=\d late=(\d+) gpu_lifts=(\d+)/);
      const k = r.match(/janks=(\d+)/);
      el.textContent = m && m[1] !== "0" ? T.fas_watch(Number(m[2]), m[3], m[4], k ? k[1] : "0") : T.fas_idle;
    };
    showFas();
    setInterval(() => { if (!document.hidden) showFas(); }, 3000);
  }
  const io = document.getElementById("adios");
  io.checked = (await exec(`cat ${STATE}/adios 2>/dev/null`)).stdout.trim() !== "0";
  io.onchange = async () => {
    const on = io.checked;
    await exec(`mkdir -p ${STATE} && echo ${on ? 1 : 0} > ${STATE}/adios && sh ${MODDIR}/io.sh ${on ? "apply" : "revert"}`);
    status(on ? T.io_on : T.io_off);
  };
  const lmk = document.getElementById("lmk");
  lmk.checked = (await exec(`cat ${STATE}/lmk 2>/dev/null`)).stdout.trim() !== "0";
  lmk.onchange = async () => {
    const on = lmk.checked;
    await exec(`mkdir -p ${STATE} && echo ${on ? 1 : 0} > ${STATE}/lmk && sh ${MODDIR}/lmk.sh ${on ? "apply" : "revert"}`);
    status(on ? T.lmk_on : T.lmk_off);
  };
  const z = document.getElementById("zram2");
  z.checked = (await exec(`cat ${STATE}/zram2 2>/dev/null`)).stdout.trim() !== "0";
  z.onchange = async () => {
    await exec(`mkdir -p ${STATE} && echo ${z.checked ? 1 : 0} > ${STATE}/zram2`);
    status(T.z_saved);
  };
  document.getElementById("perapp").onchange = async (e) => {
    const v = e.target.checked ? 1 : 0;
    await exec(`echo ${v} > ${NODE}/per_app && mkdir -p ${STATE} && echo ${v} > ${STATE}/per_app`);
    readMode();
  };
  document.getElementById("appfilter").oninput = (e) => {
    const f = e.target.value.toLowerCase();
    for (const r of document.querySelectorAll("#apps .row"))
      r.style.display = r.dataset.pkg.toLowerCase().includes(f) ? "" : "none";
  };
  loadApps();
  document.getElementById("wlreload").onclick = loadWakelocks;
  loadWakelocks();
}
// ---- power meter (runs only while the WebUI is visible) ----
const BAT = "/sys/class/power_supply/battery";
const samples = [];
async function samplePower() {
  if (document.hidden) return;
  const r = await exec(`cat ${BAT}/current_now ${BAT}/voltage_now ${BAT}/status`);
  const [i, v, st] = r.stdout.trim().split("\n");
  if (!i || !v) return;
  const w = Math.abs(Number(i) * Number(v)) / 1e12;	// uA * uV -> W
  const now = document.getElementById("pw_now");
  if (st === "Charging") { now.textContent = T.pw_charging; samples.length = 0; return; }
  now.textContent = w.toFixed(2) + " W";
  samples.push(w);
  if (samples.length > 60) samples.shift();
  const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
  document.getElementById("pw_avg").textContent = T.pw_avg(avg.toFixed(2));
}
setInterval(samplePower, 1000);
samplePower();

init();
</script>
